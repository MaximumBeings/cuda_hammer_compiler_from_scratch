site_name: CUDA Hammer -- Under Development
site_description: A Tensor Compiler in C++, From a Minimal IR to Fused, Autotuned Kernels
site_author: Oluwaseyi Awoga
copyright: Copyright &copy; 2026 Oluwaseyi Awoga

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: yellow
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: yellow
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    logo: material/hammer

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - footnotes

plugins:
  - search

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - "Part 0 -- Why Compile Tensor Programs At All":
      - "1. The Cost of Eager Execution": part0/01-the-cost-of-eager-execution.md
      - "2. What a Compiler Pipeline Looks Like": part0/02-what-a-compiler-pipeline-looks-like.md
      - "3. A Tour of Real ML Compilers: XLA, TVM, and Triton": part0/03-a-tour-of-real-ml-compilers-xla-tvm-and-triton.md
  - "Part 1 -- CUDA Hammer's IR: A Minimal Tensor Graph From Scratch":
      - "4. Representing Tensors and Operations as a Graph": part1/04-representing-tensors-and-operations-as-a-graph.md
      - "5. Building the Graph: CUDA Hammer's Frontend": part1/05-building-the-graph-cuda-hammers-frontend.md
      - "6. Graph Validation and Shape Inference": part1/06-graph-validation-and-shape-inference.md
      - "7. Printing and Visualizing CUDA Hammer's IR": part1/07-printing-and-visualizing-cuda-hammers-ir.md
  - "Part 2 -- Basic Optimization Passes":
      - "8. The Pass Manager: Structuring Compiler Transformations": part2/08-the-pass-manager-structuring-compiler-transformations.md

extra:
  social: []
