<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1337" viewBox="0 0 760 1337" role="img" aria-labelledby="title desc"><title id="title">From a tensor graph to a validated implementation</title><desc id="desc">A six-stage book map with validation boundaries.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#8ed5c4"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="1335" rx="12" fill="#0b2e63" stroke="#5b83b5" stroke-width="1.5"/><text x="32" y="38" font-size="14" fill="#8ed5c4" font-weight="700">CUDA HAMMER / THE WHOLE BOOK</text><text x="32" y="85.0" font-size="29" fill="#f5f4fa" font-weight="600">From a tensor graph to a validated</text><text x="32" y="125.6" font-size="29" fill="#f5f4fa" font-weight="600">implementation</text><rect x="32" y="187.2" width="696" height="144.6" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5"/><text x="54" y="223.2" font-size="23" fill="#f5f4fa" font-weight="600">01 / Understand the cost</text><text x="54" y="260.2" font-size="18" fill="#bdc9df" font-weight="400">Materialized arrays, launches and a qualified performance</text><text x="54" y="285.4" font-size="18" fill="#bdc9df" font-weight="400">model.</text><path d="M380 335.79999999999995 v30" fill="none" stroke="#8ed5c4" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="373.79999999999995" width="696" height="144.6" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5"/><text x="54" y="409.79999999999995" font-size="23" fill="#f5f4fa" font-weight="600">02 / Build and validate the IR</text><text x="54" y="446.79999999999995" font-size="18" fill="#bdc9df" font-weight="400">Parse names, infer shapes, inspect dependencies and print the</text><text x="54" y="471.99999999999994" font-size="18" fill="#bdc9df" font-weight="400">graph.</text><path d="M380 522.4 v30" fill="none" stroke="#8ed5c4" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="560.4" width="696" height="144.6" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5"/><text x="54" y="596.4" font-size="23" fill="#f5f4fa" font-weight="600">03 / Transform the program</text><text x="54" y="633.4" font-size="18" fill="#bdc9df" font-weight="400">Fold constants, remove dead work, reuse expressions and form</text><text x="54" y="658.6" font-size="18" fill="#bdc9df" font-weight="400">legal fusion groups.</text><path d="M380 709.0 v30" fill="none" stroke="#8ed5c4" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="747.0" width="696" height="144.6" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5"/><text x="54" y="783.0" font-size="23" fill="#f5f4fa" font-weight="600">04 / Generate and execute code</text><text x="54" y="820.0" font-size="18" fill="#bdc9df" font-weight="400">Scalar loops, target-specific SIMD, CUDA kernels and a checked</text><text x="54" y="845.2" font-size="18" fill="#bdc9df" font-weight="400">JIT boundary.</text><path d="M380 895.6 v30" fill="none" stroke="#8ed5c4" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="933.6" width="696" height="144.6" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5"/><text x="54" y="969.6" font-size="23" fill="#f5f4fa" font-weight="600">05 / Tune with context</text><text x="54" y="1006.6" font-size="18" fill="#bdc9df" font-weight="400">Search schedules, measure correct candidates and cache under</text><text x="54" y="1031.8" font-size="18" fill="#bdc9df" font-weight="400">sufficient target metadata.</text><path d="M380 1082.2 v30" fill="none" stroke="#8ed5c4" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="1120.2" width="696" height="144.6" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5"/><text x="54" y="1156.2" font-size="23" fill="#f5f4fa" font-weight="600">06 / Compare and apply</text><text x="54" y="1193.2" font-size="18" fill="#bdc9df" font-weight="400">Production compiler case studies, fixed pipelines, independent</text><text x="54" y="1218.4" font-size="18" fill="#bdc9df" font-weight="400">references and explicit limits.</text><text x="32" y="1303.8" font-size="20" fill="#8ed5c4" font-weight="600">Compile checks != host execution != GPU execution.</text></g></svg>