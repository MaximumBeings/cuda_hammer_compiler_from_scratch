<svg xmlns="http://www.w3.org/2000/svg" width="760" height="595" viewBox="0 0 760 595" role="img" aria-labelledby="title desc"><title id="title">Reuse structurally identical expressions</title><desc id="desc">operation and operands; structural key; existing result. Only merge operations whose semantics and attributes agree.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#8ed5c4"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="593" rx="12" fill="#0b2e63" stroke="#5b83b5" stroke-width="1.5"/><text x="32" y="38" font-size="14" fill="#8ed5c4" font-weight="700">CUDA HAMMER / CONCEPT 10.1</text><text x="32" y="84.0" font-size="27" fill="#f5f4fa" font-weight="600">Reuse structurally identical expressions</text><rect x="40" y="137.8" width="680" height="84" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5"/><text x="55" y="164.8" font-size="13" fill="#8ed5c4" font-weight="700">1</text><text x="72" y="176.8" font-size="23" fill="#f5f4fa" font-weight="500">operation and operands</text><path d="M380 225.8 v30" fill="none" stroke="#8ed5c4" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="263.8" width="680" height="84" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5"/><text x="55" y="290.8" font-size="13" fill="#8ed5c4" font-weight="700">2</text><text x="72" y="302.8" font-size="23" fill="#f5f4fa" font-weight="500">structural key</text><path d="M380 351.8 v30" fill="none" stroke="#8ed5c4" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="389.8" width="680" height="84" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5"/><text x="55" y="416.8" font-size="13" fill="#8ed5c4" font-weight="700">3</text><text x="72" y="428.8" font-size="23" fill="#f5f4fa" font-weight="500">existing result</text><rect x="32" y="499.8" width="696" height="69.2" rx="12" fill="#123e68" stroke="#5b83b5" stroke-width="1.5"/><text x="52" y="534.8" font-size="18" fill="#bdc9df" font-weight="400">Only merge operations whose semantics and attributes agree.</text></g></svg>