<svg xmlns="http://www.w3.org/2000/svg" width="760" height="780" viewBox="0 0 760 780" role="img" aria-labelledby="title desc"><title id="title">One shared value, two consumers</title><desc id="desc">t1 has two users. Preserve reuse or account for recomputation when forming fusion groups.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#8ed5c4"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect x="1" y="1" width="758" height="778" rx="12" fill="#0b2e63" stroke="#5b83b5" stroke-width="1.5"/><text x="32" y="38" font-size="14" fill="#8ed5c4" font-weight="700">CUDA HAMMER / CONCEPT 4.1</text><text x="32" y="88" font-size="29" fill="#f5f4fa" font-weight="600">One shared value, two consumers</text><rect x="70" y="145" width="250" height="72" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5"/><text x="88" y="189" font-size="23" fill="#f5f4fa" font-weight="500">input a</text><rect x="440" y="145" width="250" height="72" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5"/><text x="458" y="189" font-size="23" fill="#f5f4fa" font-weight="500">input b</text><rect x="255" y="275" width="250" height="72" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5"/><text x="273" y="319" font-size="23" fill="#f5f4fa" font-weight="500">t1 = a + b</text><rect x="70" y="420" width="250" height="72" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5"/><text x="88" y="464" font-size="23" fill="#f5f4fa" font-weight="500">t2 = t1 * c</text><rect x="440" y="420" width="250" height="72" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5"/><text x="458" y="464" font-size="23" fill="#f5f4fa" font-weight="500">t3 = ReLU(t1)</text><rect x="255" y="565" width="250" height="72" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5"/><text x="273" y="609" font-size="23" fill="#f5f4fa" font-weight="500">out = t2 + t3</text><rect x="70" y="275" width="150" height="72" rx="12" fill="#16457e" stroke="#5b83b5" stroke-width="1.5"/><text x="88" y="319" font-size="23" fill="#f5f4fa" font-weight="500">input c</text> <path d="M145 350 V417" fill="none" stroke="#8ed5c4" stroke-width="3" marker-end="url(#arrow)"/><path d="M195 220 L350 272" fill="none" stroke="#8ed5c4" stroke-width="3" marker-end="url(#arrow)"/><path d="M565 220 L410 272" fill="none" stroke="#8ed5c4" stroke-width="3" marker-end="url(#arrow)"/><path d="M320 350 L195 417" fill="none" stroke="#8ed5c4" stroke-width="3" marker-end="url(#arrow)"/><path d="M440 350 L565 417" fill="none" stroke="#8ed5c4" stroke-width="3" marker-end="url(#arrow)"/><path d="M195 495 L350 562" fill="none" stroke="#8ed5c4" stroke-width="3" marker-end="url(#arrow)"/><path d="M565 495 L410 562" fill="none" stroke="#8ed5c4" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="660" width="696" height="98.4" rx="12" fill="#123e68" stroke="#5b83b5" stroke-width="1.5"/><text x="52" y="695.0" font-size="18" fill="#bdc9df" font-weight="400">t1 has two users. Preserve reuse or account for recomputation when</text><text x="52" y="720.2" font-size="18" fill="#bdc9df" font-weight="400">forming fusion groups.</text></g></svg>